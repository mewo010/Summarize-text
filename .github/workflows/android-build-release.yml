name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag version (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"
      release_title:
        description: "Release title"
        required: false
        default: "Brevity Android APK Release"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ARTIFACT_NAME: "brevity-android-apk"

jobs:
  # ============================================================================
  # JOB 1: Build Android APK (Separated Build Stage)
  # ============================================================================
  build-android:
    name: "Android: Build APK & Checksums"
    runs-on: ubuntu-latest
    outputs:
      apk_filename: ${{ steps.prep_apk.outputs.apk_filename }}
      version_tag: ${{ steps.prep_apk.outputs.version_tag }}
      sha256_hash: ${{ steps.prep_apk.outputs.sha256_hash }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache & Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Environment & Secrets Fallback
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i "s|GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|g" .env
          fi

      - name: Ensure Debug Keystore Exists for Consistent Signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug & Release-Ready APK via Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Package APK & Compute SHA-256 Checksum
        id: prep_apk
        run: |
          mkdir -p dist
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi

          APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_FILE="Brevity-${TAG}.apk"
          cp "$APK_SOURCE" "dist/${APK_FILE}"
          SHA256=$(sha256sum "dist/${APK_FILE}" | awk '{print $1}')
          echo "${SHA256}  ${APK_FILE}" > "dist/${APK_FILE}.sha256"

          echo "apk_filename=${APK_FILE}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha256_hash=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload Built APK Artifact for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 14

  # ============================================================================
  # JOB 2: Release APK to GitHub Releases Tab (Separated Release Stage)
  # ============================================================================
  release-android:
    name: "Android: Publish to GitHub Releases"
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Built APK Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets

      - name: Verify Downloaded APK Integrity
        run: |
          ls -lh release-assets
          cd release-assets
          sha256sum -c "*.sha256"

      - name: Generate Release Notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ## ✨ Brevity Android Release (${{ needs.build-android.outputs.version_tag }})

          **Brevity** distills long sentences, articles, transcripts, and documents into crystal-clear summaries with interactive readability analytics.

          ### 📦 Included Android Assets
          - **APK File:** `${{ needs.build-android.outputs.apk_filename }}`
          - **SHA-256 Checksum:** `${{ needs.build-android.outputs.sha256_hash }}`
          - **Min SDK:** Android 7.0 (API 24) | **Target SDK:** Android 16 (API 36)

          ### 🚀 Installation Instructions
          1. Download `${{ needs.build-android.outputs.apk_filename }}` from the **Assets** section below on your Android device.
          2. Open the downloaded APK and allow installation if prompted.
          EOF

      - name: Create GitHub Release & Upload APK to Releases Tab
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.version_tag }}
          name: "Brevity ${{ needs.build-android.outputs.version_tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/${{ needs.build-android.outputs.apk_filename }}
            release-assets/${{ needs.build-android.outputs.apk_filename }}.sha256
